<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinka</title><link rel="icon" href="/app/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/app/home.css"><link rel="stylesheet" href="/app/agent-prompt.css"><link rel="stylesheet" href="/app/workspace.css"><link rel="stylesheet" href="/app/navigator.css"><link rel="stylesheet" href="/app/appearance.css"><link rel="stylesheet" href="/app/tokens.css"><link rel="stylesheet" href="/app/update-notice.css"></head>
<body>
<header class="masthead"><a href="/" class="brand"><svg class="brand-mark" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true" focusable="false"><path class="brand-mark-a" d="M7 8h15v15H7zm19 0h15v15H26zM7 27h15v15H7z"/><path class="brand-mark-b" d="m33.5 25 10 10-10 10-10-10z"/></svg><span id="workspace-name">Tinka</span></a><span class="live"><i aria-hidden="true"></i><span id="connection" role="status">Connecting to this Mac</span></span><span class="masthead-spacer"></span><span class="masthead-tools"></span><button class="new-board primary tk-btn tk-primary" type="button"><span aria-hidden="true">+</span><span class="new-board-label">New board</span></button></header>
<main>
<section id="project-location" class="project-location" aria-label="Project location" hidden><span id="project-location-label">Project root</span><span id="project-location-path"></span><span id="project-config-location" hidden></span></section>
<section class="shelf" aria-labelledby="boards-heading"><div class="shelf-heading"><div class="shelf-title"><h1 id="boards-heading">Boards</h1><p class="shelf-sub"><span id="project-label">Project</span> · <span id="board-count"></span> · <span id="sort-label">newest first</span></p></div><div class="home-tools"><label class="home-find"><span class="sr-only">Find boards</span><svg class="tk-glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="home-find" class="tk-field" type="search" placeholder="Find boards" autocomplete="off" spellcheck="false" maxlength="200"><kbd class="tk-kbd" aria-hidden="true">/</kbd></label><div class="tk-seg home-sort" role="group" aria-label="Sort boards"><button type="button" data-sort="created" aria-pressed="true">Newest</button><button type="button" data-sort="updated" aria-pressed="false">Recently edited</button><button type="button" data-sort="az" aria-pressed="false">A–Z</button></div></div></div><p id="error" role="alert" hidden></p><div id="board-grid" class="board-grid"><p class="loading">Finding your boards…</p></div></section>
<footer><span>Made to explore. Built to take with you.</span><span id="shelf-status" role="status"></span></footer>
</main>
<dialog id="new-dialog" class="workspace-dialog workspace-dialog-compact" aria-labelledby="dialog-title">
  <form>
    <button class="workspace-close" type="button" aria-label="Close new board prompt">×</button>
    <h2 id="dialog-title">New board</h2>
    <label>Board name<input id="board-name" maxlength="160" autocomplete="off" autofocus></label>
    <label>Idea <span class="new-board-optional">(optional)</span><textarea id="board-brief" rows="2" placeholder="What should your agent explore?"></textarea></label>
    <label id="new-board-prompt" hidden>Prompt for your agent<textarea id="agent-prompt" readonly rows="5" spellcheck="false"></textarea></label>
    <p id="copy-status" role="status"></p>
    <div class="workspace-dialog-actions"><button id="show-board-prompt" class="tk-btn tk-sm" type="button" aria-expanded="false" aria-controls="new-board-prompt">Preview prompt</button><button id="copy-prompt" class="workspace-primary" type="submit">Copy prompt</button></div>
  </form>
</dialog>
<script type="module" src="/app/home.js"></script><script type="module" src="/app/update-notice.js"></script></body></html>
