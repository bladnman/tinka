<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field journal · Choose a path</title><style>*{box-sizing:border-box}body{margin:0;background:#17264b;color:#eef3ff;font:16px/1.6 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:7vh 28px}small{letter-spacing:.16em;color:#adbef2}h1{font-size:clamp(38px,6vw,62px);line-height:1.05;letter-spacing:-.04em}.choices{display:grid;gap:12px}button{padding:18px;text-align:left;color:inherit;border:1px solid #65769f;background:#243861;border-radius:12px;font:inherit;cursor:pointer}button:hover{background:#334e88}textarea{width:100%;min-height:170px;border:1px solid #65769f;border-radius:8px;padding:14px;font:inherit;background:#fff;color:#17264b}#back{margin-top:20px}[hidden]{display:none}</style><main><small>FIELD JOURNAL / 02</small><h1>What caught your attention?</h1><div class="choices"><button data-prompt="Describe one thing you saw today.">An observation ↗</button><button data-prompt="What would you like to try next?">An idea ↗</button><button data-prompt="What are you still wondering about?">A question ↗</button></div><section hidden><h2></h2><label>Your entry<textarea></textarea></label><p>This example keeps your writing only while this page is open.</p><button id="back">← Choose another path</button></section></main><script>const choices=document.querySelector('.choices'),section=document.querySelector('section');choices.onclick=e=>{const choice=e.target.closest('button');if(!choice)return;section.querySelector('h2').textContent=choice.dataset.prompt;choices.hidden=true;section.hidden=false;section.querySelector('textarea').focus()};document.querySelector('#back').onclick=()=>{section.hidden=true;choices.hidden=false};</script></html>
