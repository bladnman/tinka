<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field journal · One step</title><style>*{box-sizing:border-box}body{margin:0;background:#e9effa;color:#17264b;font:16px/1.6 system-ui,sans-serif}main{max-width:600px;margin:auto;padding:8vh 28px}small{letter-spacing:.16em}h1{font-size:clamp(38px,6vw,66px);line-height:1.05;letter-spacing:-.04em}label{display:block;margin:20px 0}input,textarea{width:100%;padding:14px;border:1px solid #a6b9df;border-radius:8px;background:#fff;font:inherit}textarea{min-height:160px}button{border:0;background:#254cd1;color:white;border-radius:30px;padding:14px 22px;font:inherit;cursor:pointer}[hidden]{display:none}</style><main><small>FIELD JOURNAL / 01</small><h1>A thought worth keeping.</h1><form><label>Name your entry<input required placeholder="Something I noticed…" maxlength="100"></label><button>Start writing →</button></form><section hidden><h2></h2><label>Your entry<textarea placeholder="Tell the story…"></textarea></label><p>This example keeps your writing only while this page is open.</p><button id="back">Start again</button></section></main><script>const form=document.querySelector('form'),section=document.querySelector('section');form.onsubmit=e=>{e.preventDefault();section.querySelector('h2').textContent=form.querySelector('input').value;form.hidden=true;section.hidden=false;section.querySelector('textarea').focus()};document.querySelector('#back').onclick=()=>{section.hidden=true;form.hidden=false;form.querySelector('input').focus()};</script></html>
